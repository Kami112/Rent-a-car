<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage booking | Noor Travel Agency</title>
<meta name="description" content="Find your booking to pay, view or download the invoice.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="container">
  <div class="crumbs"><a href="/" data-i18n="nav_home"></a> / <span data-i18n="manage_title"></span></div>
  <h1 data-i18n="manage_title"></h1><p data-i18n="manage_sub"></p>
</div></section>
<section class="section" style="padding-top:40px"><div class="container" style="max-width:560px">
  <form class="card panel" id="lookup">
    <div class="field"><label for="m-ref" data-i18n="booking_ref"></label><input class="input num" id="m-ref" placeholder="NTXXXXXX" required style="text-transform:uppercase"></div>
    <div class="field mt-2"><label for="m-email" data-i18n="email"></label><input class="input" id="m-email" type="email" required></div>
    <div class="alert alert-error hidden mt-2" id="m-err"></div>
    <button class="btn btn-primary btn-block mt-3" data-i18n="find_booking"></button>
  </form>
</div></section>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/pages/manage.js"></script>
</body>
</html>
