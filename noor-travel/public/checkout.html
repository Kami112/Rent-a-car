<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Noor Travel Agency</title>
<meta name="description" content="Secure checkout.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<div id="sandbox-banner"></div>
<section class="section" style="padding-top:32px"><div class="container">
  <h1 style="font-size:2rem" data-i18n="checkout"></h1>
  <ol class="steps"><li class="active"><b>1</b><span data-i18n="step_details"></span></li><li><b>2</b><span data-i18n="step_extras"></span></li><li><b>3</b><span data-i18n="step_payment"></span></li></ol>
  <div id="co-error-top"></div>
  <form class="layout-main" id="co" novalidate>
    <div>
      <div class="card panel hidden" id="flight-panel"></div>
      <div class="card panel"><h3 data-i18n="lead_contact"></h3>
        <div class="form-grid">
          <div class="field full"><label for="c-name" data-i18n="full_name"></label><input class="input" id="c-name" autocomplete="name" required></div>
          <div class="field"><label for="c-email" data-i18n="email"></label><input class="input" id="c-email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="c-phone" data-i18n="mobile"></label><input class="input num" id="c-phone" type="tel" autocomplete="tel" placeholder="05XXXXXXXX" required></div>
        </div>
      </div>
      <div class="card panel" id="travelers-panel"><h3 data-i18n="travelers"></h3><div id="travelers"></div></div>
      <div class="card panel hidden" id="addons-panel"><h3 data-i18n="extras"></h3><div id="addons"></div></div>
      <div class="card panel"><h3 data-i18n="special_requests"></h3><textarea class="input" id="c-notes" maxlength="2000"></textarea></div>
      <div class="card panel"><h3 data-i18n="payment_method"></h3><div class="pay-methods" id="methods"></div><div id="moyasar-box"></div></div>
    </div>
    <aside class="sticky">
      <div class="card summary">
        <h3 data-i18n="order_summary"></h3>
        <div id="sum-title" class="mb-0" style="font-weight:700"></div>
        <div id="sum-dates" class="small muted"></div>
        <div id="sum-lines" class="mt-2"></div>
        <div class="promo-row"><input class="input" id="promo" data-i18n-ph="promo_code" autocomplete="off"><button type="button" class="btn btn-outline btn-sm" id="promo-btn" data-i18n="apply"></button></div>
        <div id="promo-msg" class="small mt-1"></div>
        <label class="check mt-2"><input type="checkbox" id="terms"><span data-i18n-html="accept_terms"></span></label>
        <div class="alert alert-error hidden mt-2" id="co-err" role="alert"></div>
        <button class="btn btn-primary btn-lg btn-block mt-2" id="pay-btn"></button>
        <div class="trust">🔒 <span data-i18n="secure_note"></span></div>
        <div class="mt-2" id="sum-logos"></div>
      </div>
    </aside>
  </form>
</div></section>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/flight-search.js"></script>
<script src="/js/pages/checkout.js"></script>
</body>
</html>
