<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holiday & Umrah Packages | Ezhar Travel and Tourism</title>
<meta name="description" content="Umrah programmes and holiday packages from Riyadh with flights, hotels, transfers and guides.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="container">
  <div class="crumbs"><a href="/" data-i18n="nav_home"></a> / <span data-i18n="packages_title"></span></div>
  <h1 data-i18n="packages_title"></h1><p data-i18n="packages_sub"></p>
</div></section>
<section class="section" style="padding-top:40px"><div class="container layout-side">
  <aside class="card filters sticky">
    <div class="field"><label for="f-q" data-i18n="where_to"></label><input class="input" id="f-q" data-i18n-ph="any_destination"></div>
    <div class="field"><span class="label" data-i18n="category"></span><div class="chips" id="f-cat"></div></div>
    <div class="field"><label for="f-max" data-i18n="max_price"></label><input class="input" id="f-max" type="number" min="0" step="500"></div>
    <div class="field"><label for="f-sort" data-i18n="sort"></label><select class="input" id="f-sort">
      <option value="" data-i18n="sort_featured"></option><option value="price_asc" data-i18n="sort_price_asc"></option>
      <option value="price_desc" data-i18n="sort_price_desc"></option><option value="duration" data-i18n="sort_duration"></option></select></div>
  </aside>
  <div>
    <p class="muted" id="count" aria-live="polite"></p>
    <div class="grid grid-3" id="grid"></div>
  </div>
</div></section>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/pages/packages.js"></script>
</body>
</html>
