<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flights | Ezhar Travel and Tourism</title>
<meta name="description" content="Search and book domestic and international flights from Saudi Arabia.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#16399a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="fl-top">
  <div class="container">
    <div class="fl-summary" id="fl-summary"></div>
    <div class="fl-search hidden" id="fl-search"></div>
  </div>
</section>
<section class="section" style="padding-top:24px"><div class="container">
  <div class="fl-cal" id="fl-cal"></div>
  <div class="fl-layout">
    <aside class="card fl-filters" id="fl-filters"></aside>
    <div>
      <div class="fl-bar">
        <div class="fl-sort" role="tablist" id="fl-sort"></div>
        <button class="btn btn-outline btn-sm fl-filter-btn" id="fl-filter-btn" type="button"></button>
      </div>
      <p class="muted small" id="fl-count" aria-live="polite"></p>
      <div id="fl-list"></div>
    </div>
  </div>
</div></section>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/flight-search.js"></script>
<script src="/js/pages/flights.js"></script>
</body>
</html>
